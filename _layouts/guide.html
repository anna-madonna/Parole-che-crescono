---
layout: default
---

<div class="container">
  <h1 class="text-center">{{ page.title }}</h1>
  <hr class="star-primary">
  
  <div class="guide-content">
    {{ content }}
  </div>

  {% if page.pdf %}
  <div class="text-center mt-4">
    <a href="{{ page.pdf | relative_url }}" target="_blank" class="btn btn-primary">Scarica PDF</a>
  </div>
  {% endif %}
</div>
