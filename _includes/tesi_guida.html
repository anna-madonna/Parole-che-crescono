<section id="guide">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Guida per i genitori</h2>
        <hr class="star-primary">
      </div>
    </div>

    <div class="portfolio-flex-row">
      {% for guide in site.guide %}
      <div class="portfolio-flex-item portfolio-item">
        <a href="#guideModal-{{ guide.modal-id }}" class="portfolio-link" data-toggle="modal">
          <div class="caption">
            <div class="caption-content">
              <i class="fa fa-search-plus fa-3x"></i>
            </div>
          </div>
          <img src="{{ '/img/portfolio/' | append: guide.img | relative_url }}"
               class="img-responsive"
               alt="{{ guide.alt }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
